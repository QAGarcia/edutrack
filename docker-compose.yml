# Sobe banco + aplicação completa (API + frontend) em http://localhost:3000
#   docker compose up -d --build
#   docker compose exec app node apps/api/dist/database/cli/seed.js   # massa inicial
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edutrack
      POSTGRES_PASSWORD: edutrack
      POSTGRES_DB: edutrack
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrack"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://edutrack:edutrack@db:5432/edutrack
      JWT_SECRET: docker-local-secret-change-me
      LOGIN_RATE_LIMIT: 30
      ENABLE_TEST_ROUTES: "true"
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 30

volumes:
  pgdata:
